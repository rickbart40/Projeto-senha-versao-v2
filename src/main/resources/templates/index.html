<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gerador de Senha</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            text-align: center;
        }

        /* MENU LATERAL */
        .menu {
            position: fixed;
            left: 0;
            top: 0;
            width: 220px;
            height: 100vh;
            background-color: #1c1c1c;
            padding-top: 30px;
        }

        .menu h2 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
        }

        .menu a {
            display: block;
            color: white;
            text-decoration: none;
            padding: 15px 20px;
            font-size: 16px;
        }

        .menu a:hover {
            background-color: #333;
        }

        .menu a.ativo {
            background-color: #007bff;
        }

        /* CONTEÚDO */
        .conteudo {
            margin-left: 220px;
            padding: 40px;
            max-width: 900px;
            text-align: center;
        }

        .senha-destaque {
            font-size: 4rem;
            font-weight: bold;
            color: #007bff;
            margin: 10px 0;
        }

        .box {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
            text-align: center;
        }

        .btn {
            padding: 12px 24px;
            font-size: 1rem;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
            color: white;
        }

        .btn-gerar {
            background-color: #28a745;
        }

        .btn-limpar {
            background-color: #ffc107;
            color: black;
        }

        .btn-historico {
            background-color: #dc3545;
        }

        .btn:hover {
            opacity: 0.9;
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            background: #e9ecef;
            margin: 5px 0;
            padding: 8px;
            border-radius: 4px;
        }
    </style>
</head>

<body>

<!-- MENU LATERAL -->
<div class="menu">

    <h2>Painel</h2>

    <a href="/" class="ativo">
        🔑 Gerador de Senha
    </a>

    <a href="/display">
        📺 Display
    </a>

</div>


<!-- CONTEÚDO DO GERADOR -->
<div class="conteudo">

    <div class="box">

        <h1>Gerador de Senhas</h1>

        <h2>Gerar Nova Senha</h2>

        <div class="senha-destaque" th:text="${ultimaSenha == 0 ? '--' : ultimaSenha}">--</div>

        <form th:action="@{/gerarSenha}" method="post">

            <button type="submit" class="btn btn-gerar">
                Gerar Nova Senha
            </button>

        </form>

        <form th:action="@{/limpar}" method="post">

            <button type="submit" class="btn btn-limpar">
                Resetar Senha
            </button>

        </form>

    </div>


    <!-- HISTÓRICO -->

    <div class="box">

        <h3>Histórico de Senhas Geradas</h3>

        <p th:if="${#lists.isEmpty(historico)}">
            Nenhuma senha no histórico.
        </p>

        <ul th:if="${!#lists.isEmpty(historico)}">

            <li th:each="senha : ${historico}">

                Senha número:
                <strong th:text="${senha}"></strong>

            </li>

        </ul>

        <form th:action="@{/limparHistorico}"
              method="post"
              style="margin-top: 15px;"
              th:if="${!#lists.isEmpty(historico)}">

            <button type="submit" class="btn btn-historico">
                Limpar Histórico
            </button>

        </form>

    </div>

</div>

</body>
</html>
