<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Display</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #111;
        }

        /* MENU LATERAL */

        .menu {
            position: fixed;
            left: 0;
            top: 0;
            width: 220px;
            height: 100vh;
            background-color: #1c1c1c;
            padding-top: 30px;
        }

        .menu h2 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
        }

        .menu a {
            display: block;
            color: white;
            text-decoration: none;
            padding: 15px 20px;
            font-size: 16px;
        }

        .menu a:hover {
            background-color: #333;
        }

        .menu a.ativo {
            background-color: #007bff;
        }

        /* DISPLAY */

        .conteudo {
            margin-left: 220px;
            height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .display {

            text-align: center;

            background-color: #1c1c1c;

            padding: 60px 120px;

            border-radius: 20px;

            box-shadow:
                0 0 30px rgba(0, 0, 0, 0.8);
        }

        .titulo {

            color: white;

            font-size: 30px;

            margin-bottom: 30px;

            letter-spacing: 4px;
        }

        .senha {

            color: #00ff66;

            font-size: 10rem;

            font-weight: bold;

            letter-spacing: 10px;

        }

    </style>

</head>

<body>


<!-- MENU LATERAL -->

<div class="menu">

    <h2>Painel</h2>

    <a href="/">
        🔑 Gerador de Senha
    </a>

    <a href="/display" class="ativo">
        📺 Display
    </a>

</div>


<!-- DISPLAY -->

<div class="conteudo">

    <div class="display">

        <div class="titulo">
            SENHA ATUAL
        </div>

        <div class="senha"
             th:text="${ultimaSenha == 0 ? '--' : ultimaSenha}">

            --

        </div>

    </div>

</div>


</body>

</html>
